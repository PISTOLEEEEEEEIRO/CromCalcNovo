<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CromCalc 2026</title>
    <!-- Ícones para iPhone/Safari -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CromCalc">

    <!-- Configurações para Android e PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#08080c">
    <link rel="icon" type="image/png" href="icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           CromCalc 2026 — Industrial Dark Theme
           ============================================ */
        :root {
            --bg-primary: #08080c;
            --bg-secondary: #0f1017;
            --bg-card: #14151d;
            --bg-input: #0c0d14;
            --border-color: #1e2030;
            --accent: #FF6B00;
            --accent-light: #FF9500;
            --text-primary: #f0f0f5;
            --text-secondary: #8a8b9e;
            --text-muted: #555670;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-glow: 0 0 30px rgba(255, 107, 0, 0.2);
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-main);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        .app-header {
            padding: 16px 20px;
            background: linear-gradient(180deg, rgba(255,107,0,0.08) 0%, transparent 100%);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header-content { display: flex; align-items: center; justify-content: space-between; }

        .logo-section { display: flex; align-items: center; gap: 10px; }

        .logo-icon img { width: 56px; height: 56px; object-fit: contain; mix-blend-mode: screen; }

        .logo-text h1 {
            font-size: 1.35rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .logo-year { font-size: 0.65rem; font-weight: 600; color: var(--text-muted); letter-spacing: 2px; text-transform: uppercase; }

        .header-subtitle {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #555670 0%, #FF6B00 40%, #FF9500 60%, #555670 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer {
            0%   { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        .main-content { padding: 16px; display: flex; flex-direction: column; gap: 16px; }

        .section-label { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 8px; }

        .input-section, .service-section, .results-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 16px;
        }

        .input-group label { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }

        .input-symbol { font-size: 1rem; font-weight: 700; color: var(--accent); font-family: var(--font-mono); width: 20px; text-align: center; }

        .input-wrapper { position: relative; display: flex; align-items: center; }

        .input-wrapper input {
            width: 100%;
            height: 52px;
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            color: #fff;
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 600;
            padding: 0 50px 0 16px;
            outline: none;
            transition: 0.2s;
        }

        .input-wrapper input:focus { border-color: var(--accent); box-shadow: var(--shadow-glow); }

        .input-unit { position: absolute; right: 14px; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); pointer-events: none; }

        .quick-select { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

        .quick-select button {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 6px 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .quick-select button:active { background: var(--accent); color: #fff; }

        .service-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .service-btn {
            background: var(--bg-input);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            padding: 14px 10px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .service-btn.active {
            border-color: var(--accent);
            background: linear-gradient(135deg, rgba(255,107,0,0.15) 0%, rgba(255,107,0,0.05) 100%);
            color: #fff;
            box-shadow: 0 0 15px rgba(255,107,0,0.1);
        }

        .info-results { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }

        .info-card {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            text-align: center;
        }

        .info-label { font-size: 0.65rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }

        .info-value { font-family: var(--font-mono); font-size: 1rem; font-weight: 700; color: #fff; }

        .price-display {
            background: linear-gradient(135deg, rgba(255,107,0,0.1) 0%, rgba(255,149,0,0.05) 100%);
            border: 2px solid rgba(255,107,0,0.3);
            border-radius: var(--radius-lg);
            padding: 20px;
            text-align: center;
        }

        .price-label { font-size: 0.7rem; font-weight: 700; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }

        .price-value-wrapper {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
            font-family: var(--font-mono);
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
            margin: 4px 0;
        }

        .price-currency { font-size: 1.2rem; color: var(--accent); }

        .price-service-label { font-size: 0.75rem; font-weight: 500; color: var(--text-secondary); }

        .clear-btn {
            width: 100%;
            height: 48px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <img src="www/megaflex-logo.png.jpeg" alt="Megaflex" style="width:56px;height:56px;object-fit:contain;border-radius:4px;">
                    </div>
                    <div class="logo-text">
                        <h1>CromCalc</h1>
                        <span class="logo-year">2026</span>
                    </div>
                </div>
                <span class="header-subtitle">Megaflex</span>
            </div>
        </header>

        <main class="main-content">
            <section class="input-section">
                <div class="section-label">📐 Dimensões</div>
                <div class="input-grid">
                    <div class="input-group">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                            <label style="margin-bottom:0"><span class="input-symbol">Ø</span> Diâmetro</label>
                            <div style="display:flex;border:1px solid #1e2030;border-radius:6px;overflow:hidden;">
                                <button id="btn-mm"  onclick="setUnit('mm')"  style="background:#FF6B00;color:#fff;border:none;font-size:0.7rem;font-weight:700;padding:3px 10px;cursor:pointer;font-family:monospace;">mm</button>
                                <button id="btn-pol" onclick="setUnit('pol')" style="background:transparent;color:#555670;border:none;font-size:0.7rem;font-weight:700;padding:3px 10px;cursor:pointer;font-family:monospace;">pol</button>
                            </div>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" inputmode="decimal" id="diam" placeholder="0" oninput="calc()">
                            <span class="input-unit" id="unit-lbl">mm</span>
                        </div>
                        <div class="quick-select" id="qs-diam"></div>
                    </div>
                    <div class="input-group" style="margin-top:15px">
                        <label><span class="input-symbol">ℓ</span> Comprimento</label>
                        <div class="input-wrapper">
                            <input type="number" id="comp" placeholder="0" oninput="calc()">
                            <span class="input-unit">mm</span>
                        </div>
                        <div class="quick-select">
                            <button onclick="setM('comp', 100)">100</button>
                            <button onclick="setM('comp', 200)">200</button>
                            <button onclick="setM('comp', 300)">300</button>
                            <button onclick="setM('comp', 500)">500</button>
                            <button onclick="setM('comp', 750)">750</button>
                            <button onclick="setM('comp', 1000)">1000</button>
                            <button onclick="setM('comp', 1500)">1500</button>
                            <button onclick="setM('comp', 2000)">2000</button>
                        </div>
                    </div>
                </div>
            </section>

            <section class="service-section">
                <div class="service-grid">
                    <button class="service-btn active" id="s1" onclick="setS('s1','Cromo Camada')">Cromo Camada</button>
                    <button class="service-btn" id="s2" onclick="setS('s2','Cromagem Cliente')">Cromagem Cliente</button>
                    <button class="service-btn" id="s3" onclick="setS('s3','Retífica')">Retífica</button>
                    <button class="service-btn" id="s4" onclick="setS('s4','Mecânico')">Mecânico</button>
                </div>
            </section>

            <section class="results-section">
                <div class="info-results">
                    <div class="info-card"><span class="info-label">Área (dm²)</span><span class="info-value" id="res-a">—</span></div>
                    <div class="info-card"><span class="info-label">Peso (Kg)</span><span class="info-value" id="res-w">—</span></div>
                </div>
                <div class="price-display">
                    <span class="price-label">PREÇO FINAL</span>
                    <div class="price-value-wrapper"><span class="price-currency">R$</span> <span id="res-p">0,00</span></div>
                    <span id="res-s" style="font-size: 0.8rem; color: var(--text-secondary);">Cromo Camada</span>
                </div>
            </section>

            <button class="clear-btn" onclick="location.reload()">Limpar Tudo</button>
        </main>
    </div>

    <script>
        var s = 's1';
        var unit = 'mm';
        var MM_POL = 25.4;
        var QS_MM  = [10, 20, 30, 40, 50, 60, 80, 100];
        var QS_POL = [0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3];
        var t = { s1: function(v){return v*2;}, s2: function(v){return v/0.85;}, s3: function(v){return v*0.588;}, s4: function(v){return v;} };

        function parseD(raw) {
            var s = String(raw).replace(/["""''']/g,'').replace(',','.').trim();
            var mFrac = s.match(/^(\d+)\.(\d+)\/(\d+)$/);
            if (mFrac) return parseInt(mFrac[1]) + parseInt(mFrac[2]) / parseInt(mFrac[3]);
            var mPure = s.match(/^(\d+)\/(\d+)$/);
            if (mPure) return parseInt(mPure[1]) / parseInt(mPure[2]);
            return parseFloat(s) || 0;
        }

        function calc() {
            var dRaw = parseD(document.getElementById('diam').value);
            var dMM  = unit === 'pol' ? dRaw * MM_POL : dRaw;
            var l    = parseFloat(document.getElementById('comp').value) || 0;
            var a    = dMM > 0 && l > 0 ? (Math.PI * dMM * l) / 10000 : 0;
            var w    = dMM > 0 && l > 0 ? (Math.PI * Math.pow(dMM/2,2) * l * 7.87) / 1000000 : 0;
            var f=18.2, k=300;
            if (dMM > 50){f=32.1;k=0;} else if (dMM>25){f=27.3;k=35;} else if (dMM>15){f=24.1;k=61;} else if (dMM>10){f=21.5;k=125;}
            var b = a > 0 ? (a*f)+k : 0;
            document.getElementById('res-a').innerText = a>0 ? a.toFixed(2) : '—';
            document.getElementById('res-w').innerText = a>0 ? w.toFixed(2) : '—';
            document.getElementById('res-p').innerText = a>0 ? t[s](b).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}) : '0,00';
        }

        function setUnit(u) {
            var el = document.getElementById('diam');
            var v  = parseD(el.value);
            if (v) el.value = u==='pol' ? (v/MM_POL).toFixed(3).replace(/\.?0+$/,'') : (v*MM_POL).toFixed(1).replace(/\.0$/,'');
            unit = u;
            document.getElementById('unit-lbl').innerText = u;
            document.getElementById('btn-mm').style.background  = u==='mm'  ? '#FF6B00' : 'transparent';
            document.getElementById('btn-mm').style.color        = u==='mm'  ? '#fff'    : '#555670';
            document.getElementById('btn-pol').style.background  = u==='pol' ? '#FF6B00' : 'transparent';
            document.getElementById('btn-pol').style.color       = u==='pol' ? '#fff'    : '#555670';
            var qs = u==='pol' ? QS_POL : QS_MM;
            document.getElementById('qs-diam').innerHTML = qs.map(function(v){return '<button onclick="setM(\'diam\','+v+')">'+v+'</button>';}).join('');
            calc();
        }

        function setM(id, v) { document.getElementById(id).value = v; calc(); }
        function setS(id, txt) {
            s = id;
            document.querySelectorAll('.service-btn').forEach(function(b){b.classList.remove('active');});
            document.getElementById(id).classList.add('active');
            document.getElementById('res-s').innerText = txt;
            calc();
        }

        window.onload = function() { setUnit('mm'); };
    </script>
</body>
</html>
