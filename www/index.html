<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>CromCalc 2026</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-icon">
                        <img src="megaflex-logo.png.jpeg" alt="Megaflex" style="width:56px;height:56px;object-fit:contain;">
                    </div>
                    <div class="logo-text">
                        <h1>CromCalc</h1>
                        <span class="logo-year">2026</span>
                    </div>
                </div>
                <span class="header-subtitle">Megaflex</span>
            </div>
        </header>

        <main class="main-content">
            <section class="input-section">
                <div class="section-label">&#128208; Dimensões da Peça</div>
                <div class="input-grid">
                    <div class="input-group">
                        <div class="input-group-header">
                            <label><span class="input-symbol">&#216;</span> Diâmetro</label>
                            <div class="unit-toggle">
                                <button id="btn-unit-mm"  class="unit-btn active" onclick="setUnidade('mm')">mm</button>
                                <button id="btn-unit-pol" class="unit-btn"        onclick="setUnidade('pol')">pol</button>
                            </div>
                        </div>
                        <div class="input-wrapper" id="diametro-mm-wrapper">
                            <input type="text" inputmode="decimal" id="diametro" placeholder="0">
                            <span class="input-unit">mm</span>
                        </div>
                        <select id="diametro-pol" style="display:none">
                            <option value="">-- Selecione --</option>
                            <option value="0.25">1/4"</option>
                            <option value="0.375">3/8"</option>
                            <option value="0.5">1/2"</option>
                            <option value="0.625">5/8"</option>
                            <option value="0.75">3/4"</option>
                            <option value="0.875">7/8"</option>
                            <option value="1">1"</option>
                            <option value="1.25">1.1/4"</option>
                            <option value="1.5">1.1/2"</option>
                            <option value="1.75">1.3/4"</option>
                            <option value="2">2"</option>
                            <option value="2.25">2.1/4"</option>
                            <option value="2.5">2.1/2"</option>
                            <option value="2.75">2.3/4"</option>
                            <option value="3">3"</option>
                            <option value="3.5">3.1/2"</option>
                            <option value="4">4"</option>
                            <option value="4.5">4.1/2"</option>
                            <option value="5">5"</option>
                            <option value="5.5">5.1/2"</option>
                            <option value="6">6"</option>
                            <option value="7">7"</option>
                            <option value="8">8"</option>
                            <option value="10">10"</option>
                            <option value="12">12"</option>
                        </select>
                        <div class="quick-select" id="qs-diametro"></div>
                    </div>
                    <div class="input-group">
                        <label><span class="input-symbol">&#8467;</span> Comprimento</label>
                        <div class="input-wrapper">
                            <input type="text" inputmode="decimal" id="comprimento" placeholder="0">
                            <span class="input-unit">mm</span>
                        </div>
                        <div class="quick-select" id="qs-comprimento"></div>
                    </div>
                </div>
            </section>

            <section class="service-section">
                <div class="service-grid">
                    <button class="service-btn active" id="btn-cromoCamada" onclick="setServico('cromoCamada')">
                        <span class="service-name">Cromo Camada</span>
                    </button>
                    <button class="service-btn" id="btn-cromagemCliente" onclick="setServico('cromagemCliente')">
                        <span class="service-name">Cromagem Cliente</span>
                    </button>
                    <button class="service-btn" id="btn-retifica" onclick="setServico('retifica')">
                        <span class="service-name">Retífica</span>
                    </button>
                    <button class="service-btn" id="btn-mecanico" onclick="setServico('mecanico')">
                        <span class="service-name">Mecânico</span>
                    </button>
                </div>
            </section>

            <section class="results-section">
                <div class="info-results">
                    <div class="info-card">
                        <span class="info-label">Área</span>
                        <span class="info-value" id="result-area">—</span>
                        <span class="info-unit">dcm²</span>
                    </div>
                    <div class="info-card">
                        <span class="info-label">Faixa</span>
                        <span class="info-value" id="result-faixa">—</span>
                    </div>
                    <div class="info-card">
                        <span class="info-label">Valor Base</span>
                        <span class="info-value" id="result-base">—</span>
                        <span class="info-unit">R$</span>
                    </div>
                </div>
                <div class="price-display">
                    <span class="price-label">PREÇO FINAL</span>
                    <div class="price-value-wrapper">
                        <span class="price-currency">R$</span>
                        <span class="price-value" id="result-preco">0,00</span>
                    </div>
                    <span class="price-service-label" id="price-service-label">Cromo Camada</span>
                </div>
            </section>

            <button class="clear-btn" onclick="limparTudo()">
                Limpar / Novo Cálculo
            </button>
        </main>
    </div>
    <script src="app.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function(e) {
            if (e.data === 'reload') window.location.reload();
        });
        navigator.serviceWorker.register('/sw.js');
    }
    </script>
</body>
</html>
